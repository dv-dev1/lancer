name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      # Ubuntu 23.10+ bloqueia via AppArmor os namespaces que o sandbox do Chrome usa; sem isto os testes do chromedp morrem com "No usable sandbox".
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go vet ./...
      - run: go test ./...
      # trava a promessa do README (nada pago, sem chave do Maps): quebra se alguém colar código
      # do Places/Maps API ou do SDK oficial em vez do coletor headless de internal/maps.
      - name: sem API paga do Google nem chave do Maps
        run: |
          ! grep -rnE "places\.googleapis\.com|maps\.googleapis\.com|GOOGLE_MAPS_API_KEY" --include='*.go' .
          ! grep -E "cloud\.google\.com/go/maps|googlemaps" go.mod
